# Publica a versão web instalável (PWA) no GitHub Pages.
#
# Uso: no repositório, Settings > Pages > Build and deployment > Source:
# "GitHub Actions" (uma vez). Depois cada envio para main republica.
# Endereço: https://<usuario>.github.io/<repositorio>/
#
# O build é o mesmo do Windows/Android (rotas no fragmento da URL), por isso
# funciona numa subpasta sem regra de redirecionamento no servidor.
name: Publicar versão web (PWA)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:app -- --outDir dist-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
