name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Falha se o primeiro carregamento passar do orçamento ou se algum par
      # de cores cair abaixo do mínimo de contraste.
      - run: npm run budget
      - run: npm run contrast
